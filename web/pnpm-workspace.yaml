packages:
  - packages/*
  - apps/*
# Supply-chain cooldown: refuse to resolve a version published less than 2 days (2880 min) ago.
# Renovate waits 3 days (minimumReleaseAge), so every version it proposes is already eligible here;
# its lock-file maintenance relies on this setting, since Renovate does not gate lock refreshes itself.
minimumReleaseAge: 2880
