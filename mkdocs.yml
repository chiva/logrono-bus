site_name: Logroño Bus · Guía
site_description: Cómo usar Logroño Bus en el móvil, en una pantalla (Echo Show, Portal) o en Home Assistant.
site_url: https://chiva.github.io/logrono-bus/guia/
repo_url: https://github.com/chiva/logrono-bus
edit_uri: edit/main/docs/guia/
docs_dir: docs/guia
copyright: Proyecto no oficial · MIT

theme:
  name: material
  language: es
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: red
      accent: amber
      toggle:
        icon: material/weather-night
        name: Modo oscuro
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: red
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Modo claro
  features:
    - navigation.instant
    - navigation.footer
    - navigation.top
    - content.code.copy
    - search.highlight

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Inicio: index.md
  - Usarlo en el móvil: 02-usar-en-el-movil.md
  - Crear tu panel: 03-crear-tu-panel.md
  - Aspecto y avisos: 04-aspecto.md
  - Echo Show: 05-echo-show.md
  - Meta Portal: 06-portal.md
  - Home Assistant: 07-home-assistant.md
  - Widgets en Android: 08-widgets-android.md
  - Tu propio servidor (Docker): 09-servidor-docker.md
  - Consejos: 10-consejos.md
  - Si algo falla: 11-problemas.md
  - Preguntas frecuentes: 12-preguntas-frecuentes.md
  - Privacidad y aviso legal: 13-privacidad.md
  - Errores del servidor: errores.md
